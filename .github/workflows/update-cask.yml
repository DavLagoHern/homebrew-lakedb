name: Update LakeDB cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve latest LakeDB release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh release view --repo DavLagoHern/LakeDB --json tagName --jq .tagName)"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          checksum_url="https://github.com/DavLagoHern/LakeDB/releases/download/${tag}/LakeDB-${version}-mac-arm64.dmg.sha256"
          sha256="$(curl --fail --location --silent --show-error "$checksum_url" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid published checksum: $sha256" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          node scripts/update-cask.mjs Casks/lakedb.rb "$VERSION" "$SHA256"
          ruby -c Casks/lakedb.rb

      - name: Commit update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The cask is already at LakeDB ${VERSION}."
            exit 0
          fi
          git config user.name "LakeDB release bot"
          git config user.email "DavLagoHern@users.noreply.github.com"
          git add Casks/lakedb.rb
          git commit -m "Update LakeDB to ${VERSION}"
          git push
